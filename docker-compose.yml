services:
  postgres:
    image: postgres:16
    container_name: onlinejudge-postgres
    environment:
      POSTGRES_DB: online_judge
      POSTGRES_USER: oj_user
      POSTGRES_PASSWORD: oj_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: onlinejudge-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
