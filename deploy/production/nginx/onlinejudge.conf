upstream onlinejudge_api {
    server 127.0.0.1:5101;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name unrealstudiooj.top www.unrealstudiooj.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://unrealstudiooj.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.unrealstudiooj.top;

    ssl_certificate /etc/letsencrypt/live/unrealstudiooj.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unrealstudiooj.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://unrealstudiooj.top$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name unrealstudiooj.top;

    ssl_certificate /etc/letsencrypt/live/unrealstudiooj.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unrealstudiooj.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OnlineJudgeTLS:10m;
    ssl_session_timeout 1d;

    root /opt/onlinejudge/current/frontend;
    index index.html;
    client_max_body_size 55m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /brand/ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ ^/(api|uploads|theme-assets)(/|$) {
        proxy_pass http://onlinejudge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
