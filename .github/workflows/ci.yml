name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build, test, and check EF model drift
        shell: pwsh
        run: ./scripts/e2e/run-all-checks.ps1 -SkipFrontend -SkipE2E -SkipDemoSmoke

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, test, and build frontend
        shell: pwsh
        run: ./scripts/e2e/run-all-checks.ps1 -SkipBuild -SkipTests -SkipModelCheck -SkipE2E -SkipDemoSmoke
